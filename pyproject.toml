[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2spoken"
dynamic = ["version"]
description = "Rewrite written forms into the words a speaker says: numbers, dates, times, money, units and more, one file per language"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "linguatag[langcodes]>=0.1.5a1",
    "unicode-rbnf>=2.4.1",
    "quebra-frases>=0.3.7",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/text2spoken"

[project.optional-dependencies]
test = [
    "pytest",
    "packaging",
    "ovos-number-parser>=0.24.6a1",
    "ovos-color-parser>=0.12.4a1",
    "num2words",
    "babel",
]

[tool.setuptools.dynamic]
version = {attr = "text2spoken.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["text2spoken*"]
