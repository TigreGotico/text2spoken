[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text2spoken"
dynamic = ["version"]
description = "Rewrite written forms into the words a speaker says: numbers, dates, times, money, units and more, one file per language"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Linguistic",
]
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "linguatag[langcodes]>=0.6.0a1",
    "numtag>=0.26.0a1",
    "unicode-rbnf>=2.4.1",
    "quebra-frases>=0.3.7",
    "ovos-number-parser>=0.30.0a1",
    "ovos-date-parser>=0.39.0a1",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/text2spoken"

[project.optional-dependencies]
# Every language reads with the base install. These extras hold no package and stay one stable cycle, so that
# an install that names one, such as `text2spoken[es]`, still resolves.
ar = []
ca = []
es = []
eu = []
fr = []
it = []
nl = []
ru = []
test = [
    "pytest",
    "packaging",
    "ovos-color-parser>=0.12.4a1",
    "tugalex>=2.5.9a1",
    "matplotlib==3.11.2",  # the SVG bytes in docs/img depend on the exact version
]
pt = ["tugalex>=2.5.9a1"]

[tool.setuptools.dynamic]
version = {attr = "text2spoken.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["text2spoken*"]

[tool.setuptools.package-data]
text2spoken = [
    "data/*.json", "data/cldr/*.json", "data/cldr/LICENSE", "data/en/*.json", "data/wiktionary/*.json", "data/wiktionary/LICENSE",
]
